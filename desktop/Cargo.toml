[package]
name = "jogwheel"
version = "0.1.0"
edition = "2024"
description = "Desktop configurator and auto layer switcher for the jogwheel macropad"
license = "MIT"

[dependencies]
gpui-kit = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serialport = { version = "4", default-features = false }
x11rb = "0.13"
futures = "0.3"
anyhow = "1"

[profile.release]
strip = true
lto = "thin"
