; Jogwheel macropad - RP2040 Pico (Earle Philhower Arduino core)
;   pio run -t upload               -> macropad firmware (src/)
;   pio run -e hwtest -t upload     -> peripheral test sketch (hwtest/)
[platformio]
default_envs = pico

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
monitor_speed = 115200
; The HID firmware changes the USB product ID, so match the Pico by name instead
upload_port = /dev/serial/by-id/usb-Raspberry_Pi_Pico_4250305031373003-if00
monitor_port = /dev/serial/by-id/usb-Raspberry_Pi_Pico_4250305031373003-if00
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

[env:pico]
lib_ldf_mode = deep+
extra_scripts = pre:tools/embed_config.py
build_flags = -DARDUINOJSON_ENABLE_COMMENTS=1
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.2.1

; Same firmware, but waits for a serial connection and logs each boot step
[env:debug]
extends = env:pico
build_flags = ${env:pico.build_flags} -DBOOT_DEBUG

[env:hwtest]
build_src_filter = +<../hwtest/>
